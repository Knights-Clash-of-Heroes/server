name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm run db:generate
        env:
          DATABASE_URL: file:./prisma/dev.db

      - name: Formatação
        run: npm run format:check

      - name: Build
        run: npm run build

      - name: Testes unitários
        run: npm run test
